<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="./udongji-nav.js?v=8"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#F2F4F8; --card:#fff; --card-2:#F6F8FC; --line:#E4E8F0; --line-2:#EEF1F6; --text:#171C2B; --text-2:#58627A; --text-3:#8C95A8; --blue:#3D5AF1; --blue-d:#2E48D6; --blue-2:#EEF1FE; --blue-3:#D6DDFC; --green:#1E9E66; --green-2:#E5F6EE; --red:#D93A4A; --red-2:#FDECEE; --amber:#B7791F; --amber-2:#FFF5E0; --shadow:0 1px 2px rgba(20,27,45,.04),0 6px 20px rgba(20,27,45,.05); --r:16px; --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
    html { color-scheme: light; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
    a { color: var(--blue); } a:hover { color: var(--blue-d); }
    button { font-family: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }
    .hero { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 30px 30px 26px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    .ck { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; font-weight: 800; flex: 0 0 auto; }
    .ck.ok { background: var(--green-2); color: var(--green); } .ck.wait { background: var(--blue-2); color: var(--blue); } .ck.bad { background: var(--red-2); color: var(--red); }
    .hero h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
    .hero .sub { font-size: 14.5px; color: var(--text-2); margin-top: 6px; max-width: 56ch; text-wrap: pretty; }
    .hero .sub.bad { color: var(--red); font-weight: 600; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; flex-basis: 100%; }
    .pill { font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 8px; background: var(--card-2); color: var(--text-2); border: 1px solid var(--line); white-space: nowrap; }
    .pill.blue { background: var(--blue-2); color: var(--blue); border-color: transparent; } .pill.ok { background: var(--green-2); color: var(--green); border-color: transparent; } .pill.amber { background: var(--amber-2); color: var(--amber); border-color: transparent; }
    .acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
    a.act, button.act { display: flex; flex-direction: column; gap: 6px; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px; text-decoration: none; color: var(--text); border: 1px solid transparent; text-align: left; transition: transform .15s, border-color .15s; }
    a.act:hover, button.act:hover { transform: translateY(-2px); border-color: var(--blue-3); color: var(--text); }
    a.act.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    a.act.primary:hover { background: var(--blue-d); color: #fff; }
    a.act.primary small { color: rgba(255,255,255,.75); }
    .act b { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .act small { font-size: 13px; color: var(--text-2); }
    .tbox { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px 16px; margin-top: 16px; }
    .tbox h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .tbox h3 .muted { font-weight: 500; color: var(--text-3); font-size: 12.5px; }
    .tbox p.d { font-size: 13px; color: var(--text-3); margin-bottom: 10px; }
    textarea { width: 100%; font: 14.5px/1.65 var(--sans); border: 1px solid var(--blue-3); border-radius: 10px; padding: 12px 14px; background: var(--card); color: var(--text); resize: vertical; white-space: pre-wrap; min-height: 200px; letter-spacing: -0.01em; }
    textarea.mono { font: 13px/1.55 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; background: var(--card-2); border-color: var(--line); white-space: pre; overflow-x: auto; min-height: 160px; }
    .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .btn { font: inherit; font-size: 14px; font-weight: 700; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--blue); background: var(--blue); color: #fff; cursor: pointer; letter-spacing: -0.01em; }
    .btn:hover { background: var(--blue-d); }
    .btn.ghost { background: var(--card); color: var(--text-2); border-color: var(--line); }
    .btn.ghost:hover { background: var(--card-2); color: var(--text); }
    .copied { font-size: 13px; color: var(--green); font-weight: 600; }
    .blank { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 60px 24px; text-align: center; color: var(--text-3); }
  </style>
</helmet>
<udongji-nav current="consult" page-v="31"></udongji-nav>
<div class="wrap">
  <sc-if value="{{ hasRec }}" hint-placeholder-val="{{ true }}">
    <div class="hero">
      <div class="ck {{ ckCls }}">{{ ckIcon }}</div>
      <div><h1>{{ title }}</h1><div class="sub {{ subCls }}">{{ sub }}</div></div>
      <div class="tags"><span class="pill blue">{{ store }}</span><span class="pill">{{ who }}</span><span class="pill">{{ mode }}</span><span class="pill {{ statusCls }}">{{ statusTag }}</span><span class="pill">상담 {{ agent }}</span></div>
    </div>

    <div class="acts">
      <a class="act primary" href="consult.html"><b>새 상담 시작</b><small>이 상담은 저장됐어요. 다음 고객 통화로.</small></a>
      <a class="act" href="{{ regHref }}"><b>계약 업무로 →</b><small>서류 수치 · 페이앤 이관 양식</small></a>
      <a class="act" href="customers.html"><b>고객 목록</b><small>전체 상담 표 · 수정 · 삭제</small></a>
      <a class="act" href="index.html"><b>홈으로</b><small>업무 선택 화면</small></a>
    </div>

    <div class="tbox">
      <h3>고객 안내 문자 <span class="muted">{{ smsKind }}</span></h3>
      <p class="d">보내기 전에 ○○ 자리만 확인. 직접 고쳐서 복사해도 돼요.</p>
      <textarea id="sms" value="{{ sms }}" onInput="{{ onSms }}" spellcheck="false"></textarea>
      <div class="row"><button type="button" class="btn" onClick="{{ copySms }}">문자 복사</button><span class="copied">{{ copiedSms }}</span></div>
    </div>

  </sc-if>
  <sc-if value="{{ noRec }}" hint-placeholder-val="{{ false }}">
    <div class="blank">표시할 상담이 없어요.<br><a href="consult.html">상담 업무로 →</a></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lib: null, rec: null, sync: 'wait', err: '', sms: '', copiedSms: '' };
  KEY = 'udongji-last-done';
  async componentDidMount() {
    let rec = null; try { rec = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) {}
    if (!rec) { this.setState({ rec: null }); return; }
    let lib = null; try { lib = await import('./udongji-fb.js?v=4'); await lib.init(); } catch (e) {}
    const sms = lib ? lib.buildSMS(rec.data).text : '';
    this.setState({ lib, rec, sms, sync: rec.synced ? 'ok' : 'wait', err: rec.err || '' });
    if (lib && !rec.synced) this.retry(lib, rec);
  }
  // 상담 페이지에서 저장 실패했을 때 한 번 더 시도
  async retry(lib, rec) {
    try {
      if (!lib.isSignedIn()) throw new Error('구글 로그인이 필요해요. 홈에서 로그인 후 다시 시도하세요.');
      const row = await lib.findRowById(rec.id);
      if (row) await lib.updateRecord(row, rec.data, rec.id); else await lib.appendRecord(rec.data, rec.id);
      rec.synced = true; rec.err = ''; localStorage.setItem(this.KEY, JSON.stringify(rec));
      this.setState({ sync: 'ok', err: '' });
    } catch (e) { this.setState({ sync: 'bad', err: e.message }); }
  }
  copy(text, key) {
    const ok = () => { this.setState({ [key]: '복사됨' }); setTimeout(() => this.setState({ [key]: '' }), 1800); };
    const legacy = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(ta); ta.select(); let d = false; try { d = document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); if (d) ok(); else this.setState({ [key]: '복사 실패 — 직접 선택해 복사' }); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, legacy); else legacy();
  }
  renderVals() {
    const { lib, rec, sync, err, sms, copiedSms } = this.state;
    if (!rec) return { hasRec: false, noRec: true };
    const d = rec.data || {}, V = k => lib ? lib.val(d, k) : String(d[k] || '');
    const res = V('상담 결과') || '상담 진행', go = res === '상담 진행';
    const kind = lib ? lib.buildSMS(d).kind : '';
    return {
      hasRec: true, noRec: false,
      ckCls: sync === 'ok' ? 'ok' : sync === 'bad' ? 'bad' : 'wait', ckIcon: sync === 'ok' ? '✓' : sync === 'bad' ? '!' : '…',
      title: sync === 'ok' ? '상담 기록이 저장됐어요' : sync === 'bad' ? '저장에 실패했어요' : '저장하는 중…',
      sub: sync === 'ok' ? '고객 목록에 들어갔어요. 아래 안내 문자를 고객에게 보내고 다음 상담으로 넘어가세요. 값을 고쳐야 하면 고객 목록에서 수정하세요.' : sync === 'bad' ? err + ' — 이 페이지를 새로고침하면 다시 저장을 시도합니다.' : '잠시만요.',
      subCls: sync === 'bad' ? 'bad' : '',
      store: V('매장명') || '(매장명 없음)', who: (V('고객명') || '고객') + ' · ' + V('연락처'), mode: V('매장 구분') || res, agent: V('상담자') || '—',
      statusTag: V('상태') || res, statusCls: go ? (V('상태') === '재연락 예정' ? 'amber' : 'ok') : '',
      regHref: 'contract.html#' + rec.id,
      smsKind: kind ? '· ' + kind : '', sms, onSms: e => this.setState({ sms: e.target.value }), copySms: () => this.copy(sms, 'copiedSms'), copiedSms,
    };
  }
}
</script>
</body>
</html>
