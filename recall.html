  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="./udongji-nav.js?v=68"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#F2F4F8; --card:#fff; --card-2:#F6F8FC; --line:#E4E8F0; --line-2:#EEF1F6; --text:#171C2B; --text-2:#58627A; --text-3:#8C95A8; --blue:#3D5AF1; --blue-d:#2E48D6; --blue-2:#EEF1FE; --blue-3:#D6DDFC; --green:#1E9E66; --green-2:#E5F6EE; --red:#D93A4A; --red-2:#FDECEE; --amber:#B7791F; --amber-2:#FFF5E0; --shadow:0 1px 2px rgba(20,27,45,.04),0 6px 20px rgba(20,27,45,.05); --shadow-lg:0 8px 30px rgba(20,27,45,.16); --r:14px; --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
    html { color-scheme: light; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
    a { color: var(--blue); } a:hover { color: var(--blue-d); }
    button, input, select, textarea { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .page { max-width: 1200px; margin: 0 auto; padding: 20px 20px 60px; }
    .bar { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .brand .mark { width: 32px; height: 32px; border-radius: 10px; background: var(--amber); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
    .brand b { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; display: block; line-height: 1.2; }
    .brand small { font-size: 11.5px; color: var(--text-3); font-weight: 500; }
    .home { font-size: 12.5px; color: var(--text-3); text-decoration: none; font-weight: 600; }
    .search { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 13.5px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--text); }
    .seg { display: flex; background: var(--card-2); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
    .seg button { border: 0; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--text-2); padding: 6px 10px; border-radius: 7px; white-space: nowrap; cursor: pointer; font-variant-numeric: tabular-nums; }
    .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(20,27,45,.08); }
    .btn { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--text-2); cursor: pointer; text-decoration: none; white-space: nowrap; display: inline-block; }
    .btn:hover { background: var(--card-2); color: var(--text); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; } .btn.primary:hover { background: var(--blue-d); color: #fff; }
    .btn.danger { color: var(--red); } .btn.danger:hover { background: var(--red-2); }
    .btn:disabled { opacity: .5; cursor: default; }
    .cnt { font-size: 12.5px; color: var(--text-3); margin-left: auto; white-space: nowrap; }
    .cnt.err { color: var(--red); font-weight: 600; }
    .list { margin-top: 14px; display: grid; gap: 10px; }
    .item { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 18px; display: grid; grid-template-columns: 110px minmax(0,1fr) auto; gap: 14px; align-items: center; border-left: 4px solid var(--line); }
    .item.due { border-left-color: var(--red); } .item.today { border-left-color: var(--amber); } .item.soon { border-left-color: var(--blue); }
    @media (max-width: 720px) { .item { grid-template-columns: 1fr; } }
    .when b { display: block; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .when small { font-size: 12px; font-weight: 700; }
    .item.due .when small { color: var(--red); } .item.today .when small { color: var(--amber); } .item.soon .when small { color: var(--blue); } .when small.none { color: var(--text-3); font-weight: 500; }
    .who b { font-size: 15px; font-weight: 700; }
    .who .m { font-size: 13px; color: var(--text-2); margin-top: 2px; }
    .who .h { font-size: 12.5px; color: var(--text-3); margin-top: 4px; white-space: pre-line; }
    .pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--card-2); color: var(--text-2); margin-right: 6px; vertical-align: 1px; }
    .pill.amber { background: var(--amber-2); color: var(--amber); } .pill.gray { background: var(--card-2); color: var(--text-3); } .pill.blue { background: var(--blue-2); color: var(--blue); }
    .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .empty { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 50px 20px; text-align: center; color: var(--text-3); }
    .scrim { position: fixed; inset: 0; background: rgba(23,28,43,.3); z-index: 19; }
    .modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(460px, 92vw); background: var(--card); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 22px 24px; z-index: 20; }
    .modal h3 { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
    .modal p { font-size: 13.5px; color: var(--text-2); margin-bottom: 12px; }
    .modal label { display: block; font-size: 12px; font-weight: 700; color: var(--text-2); margin: 10px 0 5px; }
    .modal input, .modal textarea, .modal select { width: 100%; font: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--text); }
    .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: var(--text); color: #fff; font-size: 13.5px; font-weight: 600; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 30; }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</helmet>
<udongji-nav current="recall" page-v="68"></udongji-nav>
<div class="page">
  <div class="bar">
    <div class="brand"><div class="mark">우</div><div><b>재연락</b><small>상담 연기 · 재연락 예정 고객</small></div></div>
    <input class="search" type="search" placeholder="매장명 · 고객명 · 연락처 검색" value="{{ query }}" onInput="{{ onQuery }}">
    <div class="seg">
      <button type="button" class="{{ fDueCls }}" onClick="{{ setDue }}">오늘까지 {{ nDue }}</button>
      <button type="button" class="{{ fAllCls }}" onClick="{{ setAll }}">전체 {{ nAll }}</button>
    </div>
    <sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ false }}"><div class="seg"><button type="button" class="{{ scopeMineCls }}" onClick="{{ setScopeMine }}">내 담당</button><button type="button" class="{{ scopeAllCls }}" onClick="{{ setScopeAll }}">모든 상담자</button></div></sc-if>
    <button type="button" class="btn" onClick="{{ reload }}">새로고침</button>
    <span class="cnt {{ cntCls }}">{{ cntText }}</span>
  </div>

  <div class="list">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
      <div class="{{ r.cls }}">
        <div class="when"><b>{{ r.when }}</b><small class="{{ r.whenCls }}">{{ r.whenTag }}</small></div>
        <div class="who"><b>{{ r.store }}</b><div class="m"><span class="pill {{ r.resCls }}">{{ r.res }}</span>{{ r.meta }}</div><div class="h">{{ r.hist }}</div></div>
        <div class="acts">
          <a class="btn primary" href="{{ r.consultHref }}">이어서 상담 →</a>
          <button type="button" class="btn" onClick="{{ r.copySms }}">재연락 문자</button>
          <button type="button" class="btn" onClick="{{ r.reschedule }}">일정 변경</button>
          <button type="button" class="btn danger" onClick="{{ r.close }}">고객 포기</button>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{ noRows }}" hint-placeholder-val="{{ false }}"><div class="empty">{{ emptyMsg }}</div></sc-if>
  </div>

  <sc-if value="{{ hasModal }}" hint-placeholder-val="{{ false }}">
    <div class="scrim" onClick="{{ closeModal }}"></div>
    <div class="modal">
      <h3>{{ modal.title }}</h3><p>{{ modal.sub }}</p>
      <sc-if value="{{ modal.isReschedule }}" hint-placeholder-val="{{ true }}"><label>다음 연락 일시</label><input type="text" placeholder="예: 9/15 오후 2시" value="{{ modal.when }}" onInput="{{ onModalWhen }}"></sc-if>
      <sc-if value="{{ modal.isDrop }}" hint-placeholder-val="{{ false }}"><label>포기 이유 <b style="color:var(--red)">* 필수</b></label><select value="{{ modal.reason }}" onChange="{{ onModalReason }}"><option value="">선택하세요</option><option>타사 계약·이미 사용 중</option><option>조건 불만족 (수수료·약정·위약금)</option><option>인터넷·설치 환경 불가</option><option>사업자등록증 미발급·폐업</option><option>연락 두절 (3회 이상 부재)</option><option>관심 없음·거부</option><option>기타</option></select></sc-if>
      <label>{{ modal.noteLabel }}</label><textarea rows="2" value="{{ modal.note }}" onInput="{{ onModalNote }}" placeholder="{{ modal.notePh }}"></textarea>
      <div class="row"><button type="button" class="btn" onClick="{{ closeModal }}">취소</button><button type="button" class="btn primary" onClick="{{ saveModal }}" disabled="{{ busy }}">{{ modal.ok }}</button></div>
    </div>
  </sc-if>
  <div class="{{ toastCls }}">{{ toastMsg }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lib: null, items: [], loading: true, err: '', query: '', filter: 'due', modal: null, busy: false, toast: '', toastOn: false, scope: 'mine', me: null };
  async componentDidMount() {
    try {
      const lib = await import('./udongji-fb.js?v=22'); await lib.init();
      if (!lib.isSignedIn()) { location.replace('index.html#login'); return; }
      const me = await lib.me(); if (me.close) { location.replace('contract.html'); return; } this.setState({ lib, me }, () => this.load());
    } catch (e) { location.replace('index.html#login'); }
    this._on = () => this.load(); window.addEventListener('focus', this._on);
  }
  componentWillUnmount() { window.removeEventListener('focus', this._on); }
  async load() {
    const lib = this.state.lib; if (!lib) return; this.setState({ loading: true });
    try { const { items } = await lib.readAll(); this.setState({ items, loading: false, err: '' }); } catch (e) { this.setState({ loading: false, err: e.message }); }
  }
  toast(m) { clearTimeout(this._t); this.setState({ toast: m, toastOn: true }); this._t = setTimeout(() => this.setState({ toastOn: false }), 1600); }
  copy(text, label) { const ok = () => this.toast(label + ' 복사됨'); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, () => this.toast('복사 실패')); }
  // "9/15 오후 2시", "2026-09-15", "9월 15일", "다음 주 월" 등에서 날짜 추출 (실패하면 null)
  parseWhen(s) {
    s = String(s || '').trim(); if (!s) return null; const y = new Date().getFullYear();
    let m = /(\d{4})[-./](\d{1,2})[-./](\d{1,2})/.exec(s); if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = /(\d{1,2})[./월]\s*(\d{1,2})/.exec(s); if (m) { const d = new Date(y, +m[1] - 1, +m[2]); if (d < new Date(Date.now() - 30 * 864e5)) d.setFullYear(y + 1); return d; }
    if (/오늘/.test(s)) return new Date(); if (/내일/.test(s)) return new Date(Date.now() + 864e5); if (/내일모레|모레/.test(s)) return new Date(Date.now() + 2 * 864e5);
    m = /(\d+)\s*일\s*(뒤|후)/.exec(s); if (m) return new Date(Date.now() + (+m[1]) * 864e5);
    if (/다음\s*주/.test(s)) return new Date(Date.now() + 7 * 864e5);
    return null;
  }
  renderVals() {
    const { lib, items, loading, err, query, filter, modal, busy, toast, toastOn } = this.state;
    const V = (d, k) => lib ? lib.val(d, k) : String((d || {})[k] || '').trim();
    const me = lib ? lib.userEmail() : '';
    const isPost = d => d['상담 결과'] === '상담 연기' || d['상담 결과'] === '상담 불가';
    const isRecall = d => d['상태'] !== '종료' && d['상담 결과'] !== '상담 거부' && (isPost(d) || d['상태'] === '재연락 예정' || d['상태'] === '보류');
    const today0 = new Date(); today0.setHours(0, 0, 0, 0);
    const meInfo = this.state.me || {}, isAdminUser = !!meInfo.admin, scope = this.state.scope;
    const all = items.filter(it => isRecall(it.data)).filter(it => !isAdminUser || scope === 'all' || !meInfo.name || V(it.data, '상담자') === meInfo.name);
    const q = query.trim().toLowerCase();
    const enrich = it => { const d = it.data, dt = this.parseWhen(d['다음 액션 · 일시']); let days = dt ? Math.round((new Date(dt).setHours(0,0,0,0) - today0) / 864e5) : null; return { it, d, dt, days }; };
    let list = all.map(enrich).filter(x => {
      if (filter === 'due' && !(x.days === null || x.days <= 0)) return false;
      if (q && !['매장명','고객명','연락처'].some(k => V(x.d, k).toLowerCase().includes(q))) return false;
      return true;
    }).sort((a, b) => (a.days === null ? 9e9 : a.days) - (b.days === null ? 9e9 : b.days) || (b.it._updatedAt || '').localeCompare(a.it._updatedAt || ''));
    const pad = n => String(n).padStart(2, '0');
    const rows = list.map(({ it, d, dt, days }) => {
      const whenCls = days === null ? 'none' : days < 0 ? '' : days === 0 ? '' : '';
      const cls = 'item ' + (days === null ? '' : days < 0 ? 'due' : days === 0 ? 'today' : 'soon');
      const whenTag = days === null ? (V(d, '다음 액션 · 일시') ? '날짜 해석 불가' : '일정 없음') : days < 0 ? (-days) + '일 지남' : days === 0 ? '오늘' : days + '일 후';
      const when = dt ? pad(dt.getMonth() + 1) + '/' + pad(dt.getDate()) : (V(d, '다음 액션 · 일시') || '—');
      const res = isPost(d) ? '상담 연기' : (d['상태'] || '재연락');
      const n = parseInt(d['재연락 횟수'] || '0', 10) || 0;
      const hist = [V(d, '다음 액션 · 일시') && dt ? '약속: ' + V(d, '다음 액션 · 일시') : '', V(d, '특이사항'), V(d, '재연락 이력') ? V(d, '재연락 이력').split('\n').slice(-1)[0] : ''].filter(Boolean).join(' · ');
      return {
        cls, when, whenCls, whenTag, store: V(d, '매장명') || V(d, '고객명') || '(이름 없음)', res, resCls: isPost(d) ? 'gray' : 'amber',
        meta: [V(d, '고객명'), V(d, '연락처'), V(d, '매장 구분'), V(d, '상담일') ? '상담 ' + V(d, '상담일') : '', V(d, '상담자'), n ? '재연락 ' + n + '회' : ''].filter(Boolean).join(' · '), hist,
        consultHref: 'consult.html?id=' + encodeURIComponent(it.id),
        copySms: () => { const name = V(d, '고객명') ? V(d, '고객명') + ' 대표님' : '대표님'; this.copy('[우동지] ' + name + ', 우동지 ' + (V(d, '상담자') || '담당자') + '입니다.\n말씀하신 대로 커넥트 상담 이어서 연락드렸는데 통화가 어려우신 것 같아요. 편한 시간 알려주시면 그때 다시 전화드릴게요.\n감사합니다.', '재연락 문자'); },
        reschedule: () => this.setState({ modal: { id: it.id, kind: 'reschedule', title: '다음 연락 일정 변경', sub: (V(d, '매장명') || V(d, '고객명')) + ' · 지금: ' + (V(d, '다음 액션 · 일시') || '없음'), when: '', note: '', reason: '', ok: '변경', isReschedule: true, isDrop: false, noteLabel: '메모 (선택)', notePh: '부재중 · 다음 주에 다시 등' } }),
        close: () => this.setState({ modal: { id: it.id, kind: 'close', title: '고객 포기', sub: (V(d, '매장명') || V(d, '고객명')) + ' — 더 이상 연락하지 않음으로 처리해요. 이유는 반드시 남겨야 하고, 고객 목록에는 남아요.', when: '', note: '', reason: '', ok: '포기 처리', isReschedule: false, isDrop: true, noteLabel: '상세 (선택 · 기타면 필수)', notePh: '어떤 말씀을 하셨는지 한 줄' } })
      };
    });
    const setF = f => () => this.setState({ filter: f });
    const nDue = all.map(enrich).filter(x => x.days === null || x.days <= 0).length;
    return {
      query, onQuery: e => this.setState({ query: e.target.value }),
      nDue, nAll: all.length, fDueCls: filter === 'due' ? 'on' : '', fAllCls: filter === 'all' ? 'on' : '',
      setDue: setF('due'), setAll: setF('all'), reload: () => this.load(),
      isAdmin: isAdminUser, scopeMineCls: scope === 'mine' ? 'on' : '', scopeAllCls: scope === 'all' ? 'on' : '', setScopeMine: () => this.setState({ scope: 'mine' }), setScopeAll: () => this.setState({ scope: 'all' }),
      cntCls: err ? 'err' : '', cntText: err ? '오류: ' + err : loading ? '불러오는 중…' : rows.length + '건',
      rows, noRows: !loading && rows.length === 0, emptyMsg: err ? '데이터를 읽지 못했어요.' : all.length === 0 ? '재연락할 고객이 없어요.' : filter === 'due' ? '오늘까지 연락할 고객이 없어요. "전체"에서 예정 건을 볼 수 있어요.' : '조건에 맞는 건이 없어요.',
      hasModal: !!modal, modal: modal || {}, busy, closeModal: () => this.setState({ modal: null }),
      onModalWhen: e => this.setState({ modal: Object.assign({}, modal, { when: e.target.value }) }), onModalNote: e => this.setState({ modal: Object.assign({}, modal, { note: e.target.value }) }), onModalReason: e => this.setState({ modal: Object.assign({}, modal, { reason: e.target.value }) }),
      saveModal: async () => {
        if (!modal || !lib) return; const it = items.find(x => x.id === modal.id); if (!it) return; const d = it.data;
        this.setState({ busy: true });
        try {
          const stamp = '[' + lib.todayStr() + '] ';
          if (modal.kind === 'reschedule') { if (!modal.when.trim()) { this.setState({ busy: false }); this.toast('일시를 입력하세요'); return; } await lib.updateCells(it.id, { '다음 액션 · 일시': modal.when.trim(), '상태': '재연락 예정', '재연락 이력': (V(d, '재연락 이력') ? V(d, '재연락 이력') + '\n' : '') + stamp + '일정 변경 → ' + modal.when.trim() + (modal.note ? ' · ' + modal.note : '') }); this.toast('일정을 변경했어요'); }
          else { if (!modal.reason) { this.setState({ busy: false }); this.toast('포기 이유를 선택하세요'); return; } if (modal.reason === '기타' && !modal.note.trim()) { this.setState({ busy: false }); this.toast('"기타"는 상세 내용을 적어주세요'); return; } const why = modal.reason + (modal.note.trim() ? ' — ' + modal.note.trim() : ''); await lib.updateCells(it.id, { '상태': '종료', '상담 결과': '상담 거부', '포기 이유': why, '재연락 이력': (V(d, '재연락 이력') ? V(d, '재연락 이력') + '\n' : '') + stamp + '고객 포기 · ' + why }); this.toast('고객 포기 처리했어요'); }
          this.setState({ modal: null, busy: false }); await this.load();
        } catch (e) { this.setState({ busy: false }); this.toast('저장 실패: ' + e.message); }
      },
      toastCls: 'toast' + (toastOn ? ' on' : ''), toastMsg: toast
    };
  }
}
</script>
</body>
</html>
